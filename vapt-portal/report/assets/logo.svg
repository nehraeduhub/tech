<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- Hexagon (the "Hex" in RJHex). Solid fills so it renders in the PDF too. -->
  <polygon points="120,14 210,66 210,174 120,226 30,174 30,66"
           fill="#0a1f44" stroke="#e63946" stroke-width="6"/>
  <polygon points="120,40 188,79 188,161 120,200 52,161 52,79"
           fill="none" stroke="#2a9d8f" stroke-width="2.5" opacity="0.8"/>
  <!-- RJ monogram -->
  <text x="120" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="86" font-weight="700" fill="#ffffff">RJ</text>
  <!-- Hex accent dots -->
  <circle cx="120" cy="30" r="5" fill="#e63946"/>
  <circle cx="120" cy="210" r="5" fill="#e63946"/>
</svg>
