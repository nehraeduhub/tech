<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ BRAND_NAME }} VAPT Portal{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="tg-header">
    <div class="tg-brand">
      <img src="{{ url_for('static', filename='logo.svg') }}" alt="{{ BRAND_NAME }}" class="tg-logo">
      <div>
        <div class="tg-name">{{ BRAND_NAME }}</div>
        <div class="tg-tag">{{ BRAND_TAGLINE }}</div>
      </div>
    </div>
    <div class="tg-badge">AUTHORISED USE ONLY</div>
  </header>
  <main class="tg-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="tg-footer">
    {{ BRAND_NAME }} VAPT Portal · Portable edition · For authorised security testing only.
    <div class="tg-author">{{ AUTHOR_MARK }}</div>
  </footer>
</body>
</html>
